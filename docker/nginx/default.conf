server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The built bundle (js/app.js, css/app.css) is rebuilt in place with the
    # same filename, so force browsers to revalidate instead of serving a
    # stale cached copy after a rebuild. ETag/Last-Modified still yield 304
    # when unchanged, so this is cheap.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
