services:

  mysql:
    image: mysql:5.7
    container_name: berlussimo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  laravel:
    image: php:8.3-cli
    container_name: berlussimo-laravel
    working_dir: /app
    command: >
      sh -c "
        apt-get update -q && apt-get install -y -q libzip-dev libpng-dev &&
        docker-php-ext-install pdo pdo_mysql zip gd &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
    restart: unless-stopped

  vite:
    image: node:20-alpine
    container_name: berlussimo-vite
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  mysql-data:
