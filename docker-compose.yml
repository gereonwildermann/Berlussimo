services:

  mysql:
    image: mysql:5.7
    container_name: berlussimo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

# Laravel (php artisan serve --port=8000) and Vite (npm run dev) are run
# locally — they need access to .env, vendor/, and node_modules/ and work
# best with the host PHP/Node installation.
#
# To start the full dev stack:
#   docker compose up -d        # MySQL in Docker
#   php artisan serve           # Laravel on :8000
#   npm run dev                 # Vite on :5173

volumes:
  mysql-data:
